/* 레이아웃: 화면 전체가 쯔꾸르 게임 창. 장면(전원→독백→타이틀→명부→지도→인물)이 교체되고, 대화창은 화면 아래에 뜬다. 단일 다크 연출. */
:root{
  color-scheme:dark;
  --void:#07050b;      /* 화면 바탕 */
  --blood:#6e0d17;     /* 붉은 도트 커튼 */
  --pink:#f3b2dc;      /* 메인 도트 글씨 */
  --lilac:#c99ad8;     /* 보조 도트 글씨 */
  --dusk:#8f7fa6;      /* 흐린 글씨 */
  --ash:#6d5a7c;       /* 비활성 */
  --warn:#d06a84;      /* 시스템 경고 */
  --bezel-hi:#f1eee6; --bezel-mid:#ded9cd; --bezel-lo:#bdb7a8;
  --font:"Noto Sans KR","Noto Sans CJK KR",sans-serif;
}
html,body{height:100%}
body{background:#000;color:var(--pink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
#screen{position:relative;height:100%;max-width:980px;margin:0 auto;overflow:hidden;background:var(--void);user-select:none;-webkit-user-select:none}
.scene{position:absolute;inset:0}
.scene canvas.full{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas.pt{display:block;image-rendering:pixelated}

/* CRT 덧씌움 */
.ov{position:absolute;inset:0;pointer-events:none;z-index:40}
#noise{width:100%;height:100%;image-rendering:pixelated;opacity:.3;mix-blend-mode:screen}
#vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
#boot{position:absolute;inset:0;z-index:35;background:#000;pointer-events:none}
#boot i{position:absolute;inset:0;background:#f4eefa;transform:scale(0,.003);transform-origin:50% 50%;opacity:0}
#boot.on i{animation:tube .75s cubic-bezier(.3,0,.2,1) forwards}
#boot.on{animation:bootfade 1.2s .55s steps(8) forwards}
@keyframes tube{0%{transform:scale(0,.003);opacity:1}35%{transform:scale(1,.004);opacity:1}70%{transform:scale(1,1);opacity:.9}100%{transform:scale(1,1);opacity:0}}
@keyframes bootfade{to{opacity:0}}
#screen.glitch .scene{animation:gl .7s steps(7)}
#screen.glitch #noise{opacity:1}
#screen.glitch::after{content:"";position:absolute;inset:0;z-index:39;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,45,85,.22) 0 6px,transparent 6px 19px,rgba(45,224,255,.18) 19px 23px,transparent 23px 41px);animation:bars .7s steps(5)}
@keyframes gl{0%{transform:translate(0,0);filter:none}15%{transform:translate(-6px,2px);filter:hue-rotate(60deg) saturate(2)}30%{transform:translate(5px,-3px)}45%{transform:translate(-3px,0) skewX(4deg);filter:invert(.15)}60%{transform:translate(8px,1px)}75%{transform:translate(-2px,-2px);filter:hue-rotate(-40deg)}100%{transform:none;filter:none}}
#screen.shake .scene{animation:shk .45s steps(9)}
@keyframes shk{20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
@keyframes bars{0%{transform:translateY(0)}100%{transform:translateY(-60px)}}

/* 전원 */
#s-power{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;padding-bottom:6%}
.pw{opacity:0;transition:opacity .25s steps(3)}.pw.on{opacity:1}
#pwFolder{width:64px;height:52px;image-rendering:pixelated;margin-bottom:4px}
.pwbox{margin-top:14px;padding:14px 18px 12px;background:rgba(8,3,12,.97);border:3px solid var(--pink);box-shadow:0 0 0 3px #1a0a1c,inset 0 0 0 3px #1a0a1c,inset 0 0 0 5px rgba(201,154,216,.4);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.pwyes{display:flex;gap:20px;padding-left:10px}
.pwbox.nudge{animation:nudge .35s steps(5)}
@keyframes nudge{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.pwyes button{background:none;border:0;padding:4px;cursor:pointer}
.pwyes button:focus-visible{outline:2px solid var(--pink)}
#s-power.force{animation:pfx .9s steps(9)}
@keyframes pfx{0%{background:#000}10%{background:#5a0010;transform:translate(-8px,3px)}20%{background:#000;transform:translate(7px,-4px)}30%{background:#7a0018;filter:invert(1)}40%{background:#000;transform:translate(-5px,0);filter:none}60%{background:#5a0010;transform:translate(4px,2px)}80%{background:#000;transform:none}}
#s-power:hover .pwbox{border-color:#fff}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}

/* 독백 */
#s-mono{cursor:pointer}
#monoNext{position:absolute;left:50%;bottom:max(28px,8%);transform:translateX(-50%)}
#skip,#lskip{position:absolute;top:10px;left:10px;z-index:35;background:rgba(7,5,11,.75);border:2px solid var(--ash);padding:5px 7px;cursor:pointer}
#skip:hover,#skip:focus-visible,#lskip:hover,#lskip:focus-visible{border-color:var(--lilac);outline:none}

/* 타이틀 메뉴 */
#menu{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.mbtn{position:relative;display:flex;align-items:center;justify-content:center;width:100%;padding:9px 10px;cursor:pointer;
  border:3px solid var(--lilac);background:rgba(20,8,28,.58);transition:background .12s}
.mbtn::after{content:"";position:absolute;inset:5px;border-top:2px dotted currentColor;border-bottom:2px dotted currentColor;opacity:.4;pointer-events:none}
.mbtn.start{border-width:4px;border-color:var(--pink);background:rgba(40,10,40,.6);padding:18px 10px;color:var(--pink)}
.mbtn.sub{color:var(--lilac)}
.mbtn.quit{width:62%;border-color:var(--ash);color:var(--ash)}
#menu.compact{gap:6px}#menu.compact .mbtn{padding:5px 10px}#menu.compact .mbtn.start{padding:12px 10px}
.mbtn:hover,.mbtn:focus-visible{background:rgba(243,178,220,.16);outline:none}
.mbtn:focus-visible{box-shadow:0 0 0 3px var(--void),0 0 0 5px var(--pink)}
.mbtn.start:hover canvas,.mbtn.start:focus-visible canvas{animation:blink 1s steps(2,start) infinite}
.mbtn.quit canvas{animation:jit 2.6s steps(1) infinite}
@keyframes jit{0%,86%,100%{transform:none}88%{transform:translate(-2px,1px)}92%{transform:translate(3px,0)}96%{transform:translate(-1px,-1px)}}
#screen.busy #menu,#screen.busy #ledgerForm{pointer-events:none}

/* 명부 */
#ledgerForm{position:absolute;inset:0;pointer-events:none}
#nameIn{position:absolute;pointer-events:auto;background:transparent;border:0;border-radius:0;outline:none;
  font:700 18px var(--font);color:#2a1810;caret-color:#9a1622;padding:0 2px;text-shadow:1px 1px 0 rgba(42,24,16,.18)}
#nameIn::placeholder{color:rgba(58,36,24,.45)}
#nameIn:focus{background:rgba(110,13,23,.07)}
#inkCv{position:absolute;pointer-events:none}
#signBtn{position:absolute;pointer-events:auto;left:50%;transform:translateX(-50%);width:min(240px,70%);color:var(--pink);border-color:var(--pink)}

/* 대화창 */
#dlg{position:absolute;left:12px;right:12px;bottom:14px;max-width:720px;margin:0 auto;z-index:50;cursor:pointer;
  background:rgba(8,3,12,.97);border:3px solid var(--pink);padding:14px 16px 24px;
  box-shadow:0 0 0 3px #1a0a1c,inset 0 0 0 3px #1a0a1c,inset 0 0 0 5px rgba(201,154,216,.4)}
#dlg.named{padding-top:24px}
#dlgName{position:absolute;top:-24px;left:10px;background:#1a0a1c;border:3px solid var(--pink);padding:4px 8px}
#dlgText{display:block;width:100%}
#dlgNext{position:absolute;right:12px;bottom:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 소리 버튼 */
#snd{position:absolute;top:10px;right:10px;z-index:45;width:36px;height:36px;display:grid;place-items:center;font-size:16px;line-height:1;cursor:pointer;
  background:rgba(7,5,11,.75);border:2px solid var(--ash);box-shadow:inset 0 0 0 2px #1a0a1c}
#snd:hover,#snd:focus-visible{border-color:var(--pink);outline:none}
#bgm{position:absolute;top:10px;right:52px;z-index:45;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;background:rgba(7,5,11,.75);border:2px solid var(--ash);box-shadow:inset 0 0 0 2px #1a0a1c}
#bgm:hover,#bgm:focus-visible{border-color:var(--pink);outline:none}
.fx{pointer-events:none}
/* 공포도 */
#seenBox{position:absolute;top:10px;right:96px;z-index:44;padding:6px 8px;background:rgba(7,5,11,.8);border:2px solid var(--ash);box-shadow:inset 0 0 0 2px #1a0a1c;pointer-events:none}
#seenBox.full{border-color:var(--pink)}
#gauge{position:absolute;top:10px;left:10px;z-index:44;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(7,5,11,.8);border:2px solid var(--ash);box-shadow:inset 0 0 0 2px #1a0a1c}
#gBar{display:flex;gap:2px}
#gBar i{width:7px;height:12px;background:#2a1f30}
#gBar i.on{background:var(--lilac)}
#gauge.hot{border-color:#e04a5a;animation:blink .5s steps(2,start) infinite}
#gauge:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
#gauge.off{border-color:#3a2a45}#gauge.off #gBar,#gauge.off #gIcon{opacity:.3}
#toast{position:absolute;top:96px;left:50%;transform:translateX(-50%);z-index:47;width:max-content;max-width:calc(100% - 32px);padding:10px 12px;background:rgba(8,3,12,.95);border:2px solid #7a2236;box-shadow:inset 0 0 0 2px #1a0a1c;pointer-events:none}
#cFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
#gauge.hot #gBar i.on{background:#e04a5a}
/* 지도 */
#floorLbl{position:absolute;top:56px;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
#mapWrap{position:absolute;left:0;right:0;top:84px;bottom:74px;display:flex;align-items:center;justify-content:center}
#fogCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;image-rendering:pixelated}
#missTex{position:absolute;z-index:3;pointer-events:none;image-rendering:pixelated}
#mapSvg{width:100%;height:100%;display:block;flex:none}
#mapSvg text{font-family:"Galmuri11",var(--font);font-weight:700;pointer-events:none}
.hot{cursor:pointer;fill:transparent;stroke:#f3b2dc;stroke-width:5;stroke-dasharray:12 9;stroke-opacity:0}
.hot.new{animation:hotb 1.8s steps(2,start) infinite}
.hot:hover,.hot:focus-visible{stroke-opacity:.95;fill:rgba(243,178,220,.08);outline:none}
@keyframes hotb{50%{stroke-opacity:.6}}
.spark{transform-box:fill-box;transform-origin:50% 50%;animation:spk 1.4s steps(1) infinite;pointer-events:none}
.spark.b{animation-delay:-.7s}
@keyframes spk{0%{opacity:1;transform:scale(1)}20%{opacity:.85;transform:scale(.6)}40%{opacity:0}70%{opacity:.6;transform:scale(.5)}85%{opacity:1;transform:scale(1.15)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s steps(3) infinite alternate}
.flame.b{animation-duration:.37s;animation-delay:-.2s}
@keyframes flick{0%{transform:scale(1,1)}33%{transform:scale(.8,1.25) translateX(1px)}66%{transform:scale(1.15,.85) translateX(-1px)}100%{transform:scale(.9,1.12)}}
.glow{animation:glw 1.3s steps(4) infinite alternate}
@keyframes glw{0%{opacity:.55}50%{opacity:.85}100%{opacity:.65}}
#mapBar{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px;padding-left:12px;padding-right:12px}
#mapBar .mbtn{width:auto;flex:1;max-width:120px;padding:7px 4px}
#mapBar .mbtn.on{border-color:var(--pink);background:rgba(243,178,220,.14)}
.panel{position:absolute;inset:0;z-index:46;background:#05030a;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px max(16px,4%) 16px}
.panel .back{position:sticky;bottom:6px;margin:18px auto 0;width:min(260px,80%);background:rgba(8,3,12,.97);border-color:var(--pink)}
.panel-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.lg{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:2px solid #3a2a45;background:#0e0a14}
.lg svg{flex:none;width:26px;height:26px}
.lg canvas{min-width:0}
.rec{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px;cursor:pointer;border:3px solid var(--lilac);background:rgba(20,8,28,.7)}
.rec:hover,.rec:focus-visible{background:rgba(243,178,220,.14);outline:none}
.rec .thumb{flex:none;width:84px;aspect-ratio:4/3;max-width:100%;background:repeating-linear-gradient(0deg,#2a1f30 0 3px,#160f1c 3px 6px);overflow:hidden;display:block}
.rec .thumb img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated;filter:saturate(.8)}
.rec .rt{display:flex;flex-direction:column;gap:5px;min-width:0}
.lie{display:flex;justify-content:center;padding-top:6px}
/* 인물 */
#s-char{background:#05030a}
#charCard{position:absolute;left:0;right:0;top:56px;display:flex;flex-direction:column;align-items:center;gap:6px;padding-left:16px;padding-right:16px}
#walkCv{position:absolute;left:0;right:0;width:100%;image-rendering:pixelated;cursor:pointer}
#cImgBox{position:absolute;overflow:hidden;background:#000;box-shadow:0 0 0 3px #1a0a1c,0 0 0 5px rgba(201,154,216,.45)}
#cImg,#cPix{position:absolute;inset:0;width:100%;height:100%;display:block}
#cImg{object-fit:cover}
#cPix{image-rendering:pixelated}
#cLoad{position:absolute;left:50%;top:42%;transform:translateX(-50%)}
#cBtns{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:min(320px,86%);display:flex;flex-direction:column;gap:8px;z-index:6}
#cBtns .mbtn{background:rgba(8,3,12,.92)}
#cBtns .mbtn.max{border-color:var(--pink)}
#choices{position:absolute;right:14px;z-index:51;display:flex;flex-direction:column;gap:6px;width:min(300px,74%)}
#choices button{width:100%;padding:8px 10px;justify-content:flex-start;background:rgba(8,3,12,.96);border-color:var(--pink)}
#choices button:hover canvas,#choices button:focus-visible canvas{animation:blink .8s steps(2,start) infinite}
/* 수칙 · TIP · 갤러리 */
.poster{position:relative;padding:20px 18px 18px;background:#cbbd9a;display:flex;flex-direction:column;gap:9px;
  box-shadow:inset 0 0 0 3px #8f7c58,inset 0 0 0 6px #b8a67f,inset 0 0 26px rgba(80,50,20,.45),0 6px 0 #000}
.poster .rule{display:flex;gap:8px;align-items:flex-start}
.poster .play{margin-top:6px;padding:10px;border:2px dashed #8f7c58;display:flex;flex-direction:column;gap:7px}
.tipbtn .two{display:flex;flex-direction:column;align-items:center;gap:6px}
.tipbtn{margin-top:4px;border-color:var(--pink);background:rgba(40,10,40,.75)}
#tips{position:absolute;inset:0;z-index:48;background:radial-gradient(ellipse at 50% 30%,#1c0f22,#05030a 70%)}
#tipHead{position:absolute;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-left:16px;padding-right:16px}
#tipTag{animation:blink .9s steps(2,start) infinite}
#sysWarn{position:absolute;left:50%;top:34%;transform:translateX(-50%);z-index:52;width:max-content;max-width:calc(100% - 32px);padding:16px 18px;
  background:#2a0408;border:3px solid #ff3a4a;box-shadow:0 0 0 3px #000,0 0 30px rgba(255,40,60,.5);animation:warnin .5s steps(5)}
@keyframes warnin{0%{transform:translateX(-50%) scale(1.3);filter:invert(1)}40%{transform:translateX(-48%) scale(1)}70%{transform:translateX(-52%)}100%{transform:translateX(-50%);filter:none}}
.galhead{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:6px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:360px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ec{--g:#8a8494;display:flex;flex-direction:column;gap:6px;padding:6px;cursor:pointer;text-align:left;background:#0e0a14;border:3px solid var(--g);min-width:0}
.ec .art{aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;background:repeating-linear-gradient(0deg,#1a1320 0 3px,#120d17 3px 6px)}
.ec .art svg{width:34%;height:auto}
.ec .art img{width:100%;height:100%;object-fit:cover;display:block}
.ec.open{box-shadow:0 0 12px rgba(255,140,200,.5)}
.ec .gr{align-self:flex-start}
.ec:hover,.ec:focus-visible{outline:none;background:#1a1222}
.ec.R{--g:#4a7ad8}.ec.SR{--g:#9a5ad8}
.ec.SSR{--g:#e9b85c;animation:ssr 1.8s steps(1) infinite}
@keyframes ssr{0%,70%,100%{box-shadow:none;filter:none}74%{box-shadow:-3px 0 0 #ff2d55,3px 0 0 #2de0ff;filter:hue-rotate(40deg)}80%{box-shadow:3px 1px 0 #ff2d55,-3px -1px 0 #2de0ff}86%{box-shadow:none;filter:brightness(1.6)}}
#rules .back{position:static}
.gfoot{position:sticky;bottom:6px;margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
.gfoot .mbtn{position:static;margin:0;width:min(260px,80%);background:rgba(8,3,12,.97)}
#loveAsk{position:absolute;left:50%;top:30%;transform:translateX(-50%);z-index:53;width:min(320px,88%);padding:16px;display:flex;flex-direction:column;gap:12px;align-items:stretch;background:#1a0814;border:3px solid #ff7ab8;box-shadow:0 0 0 3px #000,0 0 24px rgba(255,120,180,.45)}
#fixAsk{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:53;width:min(320px,88%);padding:14px;display:flex;flex-direction:column;gap:10px;background:#140a06;border:3px solid #b98a4a;box-shadow:0 0 0 3px #000}
#fixAsk .fixb{display:flex;gap:8px;justify-content:center}
#fixIn{font:700 18px var(--font);padding:8px 10px;border:2px solid #b98a4a;background:#0b0604;color:#f3e3b5;border-radius:0;outline:none}
#hidFx{position:absolute;inset:0;z-index:48;background:#000}
#hidCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hidFx.dawn{background:linear-gradient(180deg,#0b1026 0%,#3a3460 32%,#e9a99a 72%,#fff1dc 100%)}
#hidCard{position:absolute;left:50%;top:5%;transform:translateX(-50%);width:min(290px,72%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:2}
#hidPhoto{width:100%;background:#f7efe0;padding:9px 9px 30px;box-shadow:0 8px 28px rgba(0,0,0,.55);transform:rotate(-2deg)}
#hidImg{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;display:block;width:100%;aspect-ratio:3/4;object-fit:cover;filter:sepia(1) brightness(0);transition:filter 4.5s ease-out}
#hidImg.dev{filter:sepia(0) brightness(1)}
#hidNames{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px;min-height:20px}
#hidNames canvas{opacity:0;transition:opacity .9s}#hidNames canvas.on{opacity:1}
#hidSave{background:rgba(255,246,232,.85);border-color:#c98a6a}
#loveIn{font:700 18px var(--font);padding:8px 10px;border:2px solid #ff7ab8;background:#0e0610;color:#ffd0e6;border-radius:0;outline:none}
#loveIn:focus{border-color:#fff}
#loveFx{position:absolute;inset:0;z-index:49;background:#12040c}
#loveCv{position:absolute;inset:0;width:100%;height:100%}
#loveCard{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(300px,78%);display:flex;flex-direction:column;align-items:center;gap:10px}
#loveFrame{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;box-shadow:0 0 0 3px #000,0 0 0 6px var(--lc,#ff7ab8),0 0 40px var(--lg,rgba(255,120,180,.7));clip-path:circle(0% at 50% 50%);transition:clip-path 1.2s steps(16)}
#loveFrame.on{clip-path:circle(75% at 50% 50%);animation:lvpulse 2.4s ease-in-out infinite}
#loveFrame.door{clip-path:inset(0 49.2% 0 49.2%);transition:clip-path 4s cubic-bezier(.45,.05,.2,1)}
#loveFrame.door #loveImg{filter:brightness(2.6) contrast(.7);transition:filter 4s ease-out}
#loveFrame.door.open{clip-path:inset(0 0 0 0);animation:lvpulse 3s ease-in-out 4s infinite}
#loveFrame.door.open #loveImg{filter:none}
#loveFrame.rain{clip-path:none}
#loveFrame.rain #loveImg{filter:blur(9px) brightness(.55) saturate(.5);transition:filter 5s ease-out}
#loveFrame.rain.clear #loveImg{filter:none}
.lv-rain{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(100deg,transparent 0 13px,rgba(210,225,255,.45) 13px 14px,transparent 14px 31px);background-size:100% 70px;animation:lvrain .35s linear infinite;transition:opacity 4.5s ease-out}
#loveFrame.rain .lv-rain{opacity:1}
#loveFrame.rain.clear .lv-rain{opacity:0}
@keyframes lvrain{to{background-position:0 70px}}
#loveCard>#loveTitle[hidden],#loveCard>#loveSave[hidden]{display:block!important;visibility:hidden}
#loveTag{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%)}
#loveCard>#loveSave[hidden]{display:flex!important}
#loveCard>#loveSave.gone{display:none!important}
#loveCv.dim{opacity:.18}#loveCv{transition:opacity 3.5s ease-out}
@keyframes lvpulse{50%{box-shadow:0 0 0 3px #000,0 0 0 6px var(--lc,#ff7ab8),0 0 70px var(--lg,rgba(255,120,180,.9))}}
#loveImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.lv-sweep{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 48%,rgba(255,255,255,.1) 55%,transparent 65%);background-size:250% 100%;animation:lvsweep 3.6s ease-in-out 2 forwards}
@keyframes lvsweep{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.ll{position:absolute;inset:0;pointer-events:none;overflow:hidden;mix-blend-mode:screen;z-index:1}
.ll i{position:absolute;inset:0}
.ll.saebyeok .ll-a{inset:-30%;background:radial-gradient(ellipse at 18% 40%,rgba(255,30,50,.45),rgba(160,0,20,.15) 30%,transparent 55%);animation:llred 6s ease-in-out infinite alternate}

function drawSprite(ctx,id,x,y,P,frame,flip,opt){const g=spriteGrid(id,frame,opt);g.forEach((row,yy)=>row.forEach((c,xx)=>{if(!c)return;ctx.fillStyle=c;ctx.fillRect(Math.round(x+(flip?15-xx:xx)*P),Math.round(y+yy*P),P,P);}));

const WALK={raf:0};
function act(k){WALK.act={k,t:0};if(k==='hop')WALK.hop=10;if(k==='hops'){WALK.hops=3;WALK.hop=10;}}
function startWalk(id){const cv=$('#walkCv');cancelAnimationFrame(WALK.raf);WALK.act=null;WALK.hop=0;WALK.hops=0;WALK.sx=0;if(!id){cv.hidden=true;return;}cv.hidden=false;
  const{ctx,W,H}=fit(cv);const P=Math.max(2,Math.floor(H/24));const mode={saebyeok:'sit',jangma:'once',angae:'wander',haetsal:'slow',seori:'slow'}[id];
  const spd=mode==='slow'?.42:.9,fper=mode==='slow'?18:10,minX=8,maxX=W-16*P-8;let x=W/2-8*P,dir=1,t=0,pause=60,frame=0,done=false;
  if(mode==='once'){dir=Math.random()<.5?-1:1;pause=40;}
  const loop=()=>{t++;ctx.clearRect(0,0,W,H);const gy=H-24*P-P,A=WALK.act;let dx=0,flip=dir<0,sit=mode==='sit',busy=false,blink=false;
    if(A){A.t++;busy=true;const k=A.k,T=A.t;
      if(k==='shiver'){dx=(T%4<2?1:-1)*P;if(T>40)WALK.act=null;}
      else if(k==='turn'){flip=!(dir<0);if(T>170)WALK.act=null;}
      else if(k==='spin'){flip=Math.floor(T/5)%2===0;if(T>40)WALK.act=null;}
      else if(k==='crouch'||k==='faint'){sit=true;blink=k==='faint'&&(T%90)>20;if(T>(k==='faint'?260:150))WALK.act=null;}
      else if(k==='flee'){const tx=x<W/2?minX:maxX;if(mode!=='sit'){dir=tx>x?1:-1;x+=dir*3.2;if(T%4===0)frame++;if(Math.abs(tx-x)<4){x=tx;flip=!(dir<0);}}else{WALK.sx=Math.min(W/2-10*P,(WALK.sx||0)+4);flip=true;}if(T>260)WALK.act=null;}
      else if(k==='closer'){const tx=W/2-8*P;if(mode!=='sit'){dir=tx>x?1:-1;if(Math.abs(tx-x)>2){x+=dir*1.6;if(T%6===0)frame++;}}if(T>150)WALK.act=null;}
      else if(k==='lunge'){const tx=W/2-8*P;dx=(T<8?T:T<20?8:Math.max(0,28-T))*Math.sign(tx-x||1)*P*.7;if(T>28)WALK.act=null;}
      else if(k==='scoot'){WALK.sx=Math.min(4*P,(WALK.sx||0)+1);if(T>60)WALK.act=null;}
      else if(k==='freeze'){blink=false;if(T>120)WALK.act=null;}
      else if(k==='hop'||k==='hops'){busy=WALK.hop>0;if(!WALK.hop)WALK.act=null;}}
    if(mode==='sit'){const bx=W/2-9*P+(WALK.sx||0);ctx.fillStyle='#4a3424';ctx.fillRect(Math.round(bx),Math.round(gy+19*P),18*P,2*P);ctx.fillStyle='#3a2818';ctx.fillRect(Math.round(bx+P),Math.round(gy+21*P),P*2,3*P);ctx.fillRect(Math.round(bx+15*P),Math.round(gy+21*P),P*2,3*P);
      const hop=WALK.hop>0?Math.round(Math.sin((10-WALK.hop)/10*Math.PI)*3)*P:0;if(WALK.hop>0)WALK.hop--;
      drawSprite(ctx,id,W/2-8*P+(WALK.sx||0)+dx,gy-hop,P,0,A&&A.k==='flee'?true:flip&&A?flip:false,{sit:1,back:!!(A&&(A.k==='turn'||A.k==='flee')),blink:(A&&A.k==='freeze')?false:(t%200)<8||((t%200)>14&&(t%200)<20)});}
    else{
      if(!busy){
        if(mode==='once'){if(pause>0)pause--;else if(!done){x+=dir*spd;if(t%fper===0)frame++;if(x<minX||x>maxX){x=Math.max(minX,Math.min(maxX,x));done=true;frame=0;}}}
        else if(pause>0){pause--;if(pause===0){dir=Math.random()<.5?-1:1;if(x<W*.2)dir=1;if(x>W*.7)dir=-1;WALK.go=(40+Math.random()*90|0)*(mode==='slow'?2:1);}}
        else{x+=dir*spd;if(t%fper===0)frame++;WALK.go--;if(WALK.go<=0||x<minX||x>maxX){pause=50+Math.random()*120|0;x=Math.max(minX,Math.min(maxX,x));}}}
      x=Math.max(minX,Math.min(maxX,x));

    if(!RM)WALK.raf=requestAnimationFrame(loop);};loop();}

function startMaxFx(){const cv=$('#cFx');cv.hidden=false;const{ctx,W,H}=fit(cv);const P=Math.max(2,Math.round(W/240));
  const parts=Array.from({length:14},()=>({x:Math.random()*W,y:H*(.4+Math.random()*.7),v:.25+Math.random()*.5,s:P*(1+(Math.random()*2|0)),ph:Math.random()*6}));
  let t=0,tear=0;cancelAnimationFrame(fxRaf);
  const loop=()=>{t++;ctx.clearRect(0,0,W,H);
    const pulse=.22+.12*Math.sin(t/22);const g=ctx.createRadialGradient(W/2,H*.45,H*.25,W/2,H*.45,W*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(160,30,90,${pulse})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(const p of parts){p.y-=p.v;p.x+=Math.sin((t+p.ph*40)/30)*.3;if(p.y<-20){p.y=H+10;p.x=Math.random()*W;}
      const a=Math.min(1,(H-p.y)/(H*.4))*Math.min(1,p.y/(H*.3));const gl=Math.random()<.04;
      HEART.forEach((r,yy)=>[...r].forEach((ch,xx)=>{if(ch!=='#')return;ctx.globalAlpha=Math.max(0,a)*.75;ctx.fillStyle=gl?(xx%2?'#2de0ff':'#ff2d55'):(yy<2?'#ffd0e6':'#f08fae');ctx.fillRect(Math.round(p.x+xx*p.s+(gl?P*2:0)),Math.round(p.y+yy*p.s),p.s,p.s);}));}
    ctx.globalAlpha=.08;ctx.fillStyle='#000';for(let y=(t%4);y<H;y+=4)ctx.fillRect(0,y,W,1);
    const sy=(t*2.2)%(H+60)-30;ctx.globalAlpha=.07;ctx.fillStyle='#fff';ctx.fillRect(0,sy,W,18);
    if(tear>0){tear--;const y=Math.random()*H;ctx.globalAlpha=.5;ctx.fillStyle=Math.random()<.5?'#ff2d55':'#2de0ff';ctx.fillRect(0,y,W,P);}else if(Math.random()<.012)tear=4;
    ctx.globalAlpha=1;if(!RM)fxRaf=requestAnimationFrame(loop);};loop();}

Snd.tick=function(){[0,.5,1].forEach(t=>this.tone(2600,.025,'square',.04,t));};
function drawConfess(){const cv=$('#dumCv');const{ctx,W,H}=fit(cv);const P=W>700?4:3,LW=Math.ceil(W/P),LH=Math.ceil(H/P);
  const lo=document.createElement('canvas');lo.width=LW;lo.height=LH;const l=lo.getContext('2d');l.fillStyle='#120a06';l.fillRect(0,0,LW,LH);
  const gx=Math.round(LW*.2),gy=Math.round(LH*.12),gw=Math.round(LW*.6),gh=Math.round(LH*.22);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const on=((x+y)%8<2)||((x-y+64)%8<2);lpx(l,gx+x,gy+y,on?'#2a1810':((x+y)%2?'#3a2a1c':'#4a3424'));}
  for(let y=0;y<LH;y++)for(let x=0;x<LW;x++)if((x%14===0||x%14===1)&&(y<gy||y>gy+gh))lpx(l,x,y,'#1c110a');
  ctx.imageSmoothingEnabled=false;ctx.drawImage(lo,0,0,LW*P,LH*P);}
function holdBreath(){return new Promise(res=>{const box=$('#holdBox'),btn=$('#holdBtn'),bar=$('#holdBar i');box.hidden=false;label(btn.querySelector('canvas'));bar.style.width='0';
  let t0=null,raf,done=false,steps=[0,1100,1900,3000],si=0;const DUR=3600;
  const end=ok=>{if(done)return;done=true;cancelAnimationFrame(raf);box.hidden=true;btn.classList.remove('on');off();res(ok);};
  const loop=()=>{const t=performance.now()-t0;bar.style.width=Math.min(100,t/DUR*100)+'%';
    if(si<steps.length&&t>=steps[si]){const v=[.3,.26,.2,.12][si];Snd.tone(85,.2,'triangle',v,0,42);Snd.noise(.08,v*.7,320,0,'lowpass');si++;}
    if(t>=DUR)return end(true);raf=requestAnimationFrame(loop);};
  const down=e=>{e.preventDefault();if(t0!==null||done)return;t0=performance.now();btn.classList.add('on');loop();};
  const up=()=>{if(t0!==null&&!done)end(false);};
  const kd=e=>{if(e.key===' '||e.key==='Enter'){if(!e.repeat)down(e);}},ku=e=>{if(e.key===' '||e.key==='Enter')up();};
  const off=()=>{btn.removeEventListener('pointerdown',down);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);btn.removeEventListener('pointerleave',up);removeEventListener('keydown',kd);removeEventListener('keyup',ku);};
  btn.addEventListener('pointerdown',down);addEventListener('pointerup',up);addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up);addEventListener('keydown',kd);addEventListener('keyup',ku);
  if(RM)end(true);});}
async function toNoeulRoom(){if(Music.cur&&THEMES[Music.cur.key])Music.play(S.bgm);CUR=null;go('map');await setFloor('2F',true);setVB(pad(ROOMS.noeul.r));S.loc='safe';
  await Dlg.say([Sys('……'),Sys('헉헉대는 소리, 다 들렸습니다. 정말 열심히 뛰시더군요.'),Sys('제작자님이 직접 만든 괴물에게 쫓기시는 모습, 생각보다 재미있었습니다.'),Sys('걱정 마십시오. 촛불 곁은 안전합니다. …촛불이 저절로 꺼지지만 않는다면요.'),Sys('다음엔 조금 조용히 뛰십시오. 그것도 귀는 있으니까요.')]);
  S.zoom=true;await animVB(VIEWS['2F']);S.zoom=false;S.loc='dark';}
async function dummyEvent(){if(S.event)return;S.event=true;S.lock=true;Music.duck(.25);$('#records').hidden=true;$('#legend').hidden=true;$('#choices').hidden=true;
  const d=$('#dummy');d.hidden=false;
  for(const[step,wait]of [[0,1100],[1,1300]]){drawDummy(step);Snd.step();await sleep(RM?80:wait);}
  Snd.bell();
  const i=await Dlg.ask(Sys('더미가 다가옵니다. 고해실 문이 열렸습니다.'),['촛불이 있는 곳으로 달린다.','고해실에 숨는다.']);
  if(i===0){for(const[step,wait]of [[2,300],[3,800]]){drawDummy(step);Snd.step();await sleep(RM?80:wait);}
    await glitch(700);d.hidden=true;S.fear=0;drawGauge();await toNoeulRoom();}
  else{Snd.tone(300,.4,'sawtooth',.03,0,150);drawConfess();
    await Dlg.say([Sys('고해실 안. 더미는 당신을 보지 못합니다.'),Sys('대신, 소리는 듣습니다.'),Sys('버튼을 누른 채로, 발소리가 지나갈 때까지 숨을 참으십시오.')]);
    const ok=await holdBreath();S.fear=0;drawGauge();
    if(ok){await Dlg.say([Sys('…발소리가 멀어집니다.'),Sys('오늘은 들키지 않았군요. 숨소리도, 고해도.')]);d.hidden=true;
      CUR=null;go('map');await setFloor('1F',true);setVB(pad(ROOMS.confess.r));S.zoom=true;await animVB(VIEWS['1F']);S.zoom=false;S.loc='hall';}
    else{Snd.gasp();await shake();drawDummy(3);await Dlg.say([Sys('…숨소리가 새어 나갔습니다.',WARN)]);await glitch(700);d.hidden=true;await toNoeulRoom();}}
  S.event=false;S.lock=false;Music.duck(1);}

function drawDoors(p){const cv=$('#doorCv'),{ctx,W,H}=fit(cv);ctx.fillStyle='#000';if(p>=1){ctx.clearRect(0,0,W,H);return;}
  const P=Math.max(3,Math.round(W/90)),half=W/2,dw=half*(1-p),inner=ctx.createLinearGradient(0,0,0,H);inner.addColorStop(0,'rgba(233,184,92,'+(.25*p)+')');inner.addColorStop(1,'rgba(0,0,0,0)');
  ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(0,0,0,'+(1-p)+')';ctx.fillRect(0,0,W,H);ctx.fillStyle=inner;ctx.fillRect(half-half*p,0,W*p,H);
  const door=(x0,w,left)=>{if(w<2)return;const sh=1-p*.6;for(let x=0;x<w;x+=P){const plank=Math.floor(x/(P*6))%2;ctx.fillStyle=plank?'#3a2414':'#4a2e1a';ctx.fillRect(Math.round(x0+x),0,P,H);}
    for(let x=0;x<w;x+=P*6){ctx.fillStyle='#22140a';ctx.fillRect(Math.round(x0+x),0,Math.max(1,P/2),H);}
    [H*.18,H*.5,H*.82].forEach(y=>{ctx.fillStyle='#1a1a20';ctx.fillRect(Math.round(x0),Math.round(y),Math.round(w),P*2);ctx.fillStyle='#4a4a56';for(let x=P*2;x<w;x+=P*5)ctx.fillRect(Math.round(x0+x),Math.round(y+P/2),P,P);});
    const hx=left?x0+w-P*5:x0+P*3;ctx.fillStyle='#c9a24a';ctx.fillRect(Math.round(hx),Math.round(H*.48),P*2,P*5);ctx.fillRect(Math.round(hx-P),Math.round(H*.48+P*4),P*4,P*2);
    ctx.fillStyle='rgba(0,0,0,'+(.55*p)+')';ctx.fillRect(Math.round(x0),0,Math.round(w),H);};
  door(0,dw,true);door(W-dw,dw,false);
  if(p===0){ctx.fillStyle='#000';ctx.fillRect(half-P/2,0,P,H);}}
